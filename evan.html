<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENHA-FLIX - EVAN</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><filter id='shadow'><feDropShadow dx='1' dy='1' stdDeviation='1' flood-color='%23000' flood-opacity='0.3'/></filter></defs><text x='50%' y='50%' text-anchor='middle' dy='.35em' font-size='85' fill='%23e50914' font-weight='900' font-family='Arial, sans-serif' filter='url(%23shadow)'>E</text></svg>">
    <link rel="stylesheet" href="styles/styles.css">
    <style>
        /* Additional custom styles for the EVAN page */
        .evan-container {
            max-width: 1200px;
            margin: 100px auto 50px;
            padding: 0 20px;
        }

        /* Hero Banner Section */
        .evan-hero {
            position: relative;
            height: 70vh;
            min-height: 500px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 50px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Overlay for the hero section */
        .evan-hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 50px;
            text-align: center;
        }

        .evan-hero-content h1 {
            font-size: 5rem;
            font-weight: 700;
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            letter-spacing: 5px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards;
        }

        .coming-soon-badge {
            background: rgba(229, 9, 20, 0.9);
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: inline-block;
            backdrop-filter: blur(5px);
            opacity: 0;
            animation: fadeInUp 1s ease 0.2s forwards;
        }

        .evan-hero-content p {
            font-size: 1.2rem;
            color: #ddd;
            max-width: 600px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeInUp 1s ease 0.4s forwards;
        }

        /* Info Section */
        .info-section {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 40px;
            margin-top: 40px;
            border: 1px solid #333;
            text-align: center;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.6s forwards;
        }

        .info-section h2 {
            font-size: 2rem;
            color: #e0e0e0;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .info-section p {
            color: #b0b0b0;
            line-height: 1.8;
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-link {
            color: #888;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            color: #e50914;
            transform: translateY(-3px);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .evan-hero {
                height: 60vh;
                min-height: 400px;
            }
            .evan-hero-content h1 {
                font-size: 3rem;
            }
            .coming-soon-badge {
                font-size: 1rem;
                padding: 8px 20px;
            }
            .info-section {
                padding: 25px;
            }
            .info-section h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    
    <div class="evan-container">
        <!-- Hero Banner Section -->
        <!-- REPLACE 'background-image' WITH YOUR OWN PHOTO OF HEESEUNG/EVAN -->
        <div class="evan-hero" style="background-image: url('images/evan-hero.jpg');">
            <div class="evan-hero-overlay">
                <div class="evan-hero-content">
                    <div class="coming-soon-badge"> COMING SOON </div>
                    <h1>EVAN</h1>
                    <p>RIDE OR DIE . 2026.06.22.</p>
                </div>
            </div>
        </div>

        </body>
</html>
